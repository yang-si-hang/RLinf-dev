defaults:
  - env/realworld_ur10e@env.eval
  - model/pi0_5_ur_merged_rlinf@rollout.model   # model path define
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1    # single computer
  component_placement:
    rollout:
      node_group: ur10e
      placement: 0
    env:
      node_group: ur10e
      placement: 0
  node_groups:
    - label: ur10e
      node_ranks: 0
      hardware:   # zeromq
        type: UR10e
        configs:
          - endpoint: "tcp://127.0.0.1:5555"
            device_id: "ur10e"
            node_rank: 0

runner:
  task_type: embodied_eval
  only_eval: true
  max_epochs: 1
  max_steps: 1
  val_check_interval: -1
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "ur10e-openpi-rlinf-eval"
    logger_backends: ["tensorboard"]

algorithm:
  group_size: 1
  eval_rollout_epoch: 1
  adv_type: gae
  loss_type: actor
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 1.0
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  enable_offload: false

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: false
  collect_prev_infos: false

critic:
  use_critic_model: false
