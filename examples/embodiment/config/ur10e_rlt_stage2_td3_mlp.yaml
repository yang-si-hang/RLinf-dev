defaults:
  - env/realworld_ur10e@env.train
  - env/realworld_ur10e@env.eval
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# 解释参数
cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0
    env: all
    rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "ur10e_rlt_stage2_td3_mlp"
    logger_backends: ["wandb"]

  max_epochs: 5000  # running epochs limit
  max_steps: -1     # no steps limit
  only_eval: False
  weight_sync_interval: 1   # sync weights every 1 steps, actor use the newest weights
  val_check_interval: -1    # no validation
  save_interval: 50         # save checkpoint every 50 epochs
  overlap_env_bootstrap: False
  use_training_pipeline: False
  resume_dir: null
  ckpt_path: null

algorithm:
  ur10e_actor_only: True # actor control in whole process
  ur10e_offline_critic_checkpoint_path: ${oc.env:PROJECT_ROOT,/app}/data/rlt_checkpoints/rlt_stage2_ur10e_critic/critic_step_18000.pt
  update_epoch: 5 # 解释参数
  rlt_schedule:
    enable: True
    max_updates_per_train_step: 400   # 限制actor.run_training()的次数, 其实没作用
    warmup_min_size: 30
    warmup_post_collect_updates: 0
    train_every_episodes: 0
    train_every_transitions: 15
  group_size: 1

  adv_type: rlt_td3
  loss_type: rlt_td3
  loss_agg_func: "token-mean"

  agg_q: min      # double q
  actor_agg_q: q1 # update actor with which q function: min, q1, mean
  enable_drq: False # 解释参数
  q_head_type: ${actor.model.q_head_type}
  bootstrap_type: standard  # not bootstrap when meet stop flag 
  gamma: 0.99
  tau: 0.005    # EMA update rate

  # TD3 actor objective: -q_weight * Q + bc_weight * BC.
  q_weight: 1.0
  bc_weight: 1.0
  actor_update_action_noise: True # 解释参数
  reference_dropout_prob: 0.5
  # Schedule for the BC/Q weights in the actor objective. Disable it to use
  # the fixed bc_weight and q_weight above for the entire run.
  actor_weight_schedule:
    enable: True
    warmup_updates: 20000 # warm up steps
    ramp_updates: 50000   # 过渡到online权重的steps
    warmup_bc_weight: 7.0 # warm up stage bc weight
    warmup_q_weight: 0.05
    online_bc_weight: 2.8
    online_q_weight: 0.50
  entropy_tuning:       # TD3 has no entropy term
    alpha_type: fixed_alpha
    initial_alpha: 0.0  # zero and fixed_alpha to disable entropy term
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  replay_buffer:
    enable_cache: True
    cache_size: 10000
    sample_window_size: 50000
    max_num_samples: 50000
    min_buffer_size: 30
    auto_save: False

  target_update_freq: 1
  target_update_type: all # 副本, to stable update, also can be "critic" or "actor"
  train_actor_steps: 1000 # start train actor until replay buffer reaches this size
  critic_actor_ratio: 2   # critic update 2 steps per actor update
  critic_subsample_size: 0
  backup_entropy: False

env:
  group_name: "EnvGroup"
  train:
    env_type: realworld
    total_num_envs: 1
    rollout_epoch: 1
    auto_reset: false
    ignore_terminations: false
    reward_mode: raw
    wrap_obs_mode: simple
    seed: 0
    group_size: 1
    use_fixed_reset_state_ids: false
    max_steps_per_rollout_epoch: 450
    max_episode_steps: 450
    main_image_key: base_0_rgb  # 参数作用
    video_cfg:
      save_video: false
      info_on_video: true
      video_base_dir: ${runner.logger.log_path}/video/train
    init_params:
      id: "UR10eEnv-v1"
      num_envs: null
    override_cfg:
      endpoint: ${oc.env:UR10E_DEVICE_ENDPOINT,tcp://127.0.0.1:5555}
      timeout_ms: 120000
      require_reset_confirmation: false
      reset_confirmation_text: start
      camera_max_age_ms: 500  # rlinf check the camera image age by its timestamp
      max_num_steps: 450
      action_norm_stats_path: ${oc.env:PROJECT_ROOT,/app}/data/openpi_rlinf_checkpoints/pi05_ur10e_plug_lora_ki/plug_20260920_223703/20000/assets/plug_v2_merge_crop_vid/norm_stats.json
      replay_manifest_path: ${oc.env:PROJECT_ROOT,/app}/results/rlt_stage2_ur10e_critic/replay_manifest.json
      stage1_checkpoint_step: 18000
      stage1_success_metadata_path: ${oc.env:PROJECT_ROOT,/app}/results/rlt_z_success_step18000/metadata.json
      stage1_failure_metadata_path: ${oc.env:PROJECT_ROOT,/app}/results/rlt_z_fail_step18000/metadata.json

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: True
  collect_prev_infos: False

  model:
    model_type: ${actor.model.model_type}
    model_path: ""  # not need fill
    precision: ${actor.model.precision}
    policy_setup: ${actor.model.policy_setup}
    action_dim: ${actor.model.action_dim}
    num_action_chunks: ${actor.model.num_action_chunks}
    ref_num_action_chunks: ${actor.model.ref_num_action_chunks}
    z_dim: ${actor.model.z_dim}
    proprio_dim: ${actor.model.proprio_dim}
    add_q_head: ${actor.model.add_q_head}
    q_head_type: ${actor.model.q_head_type}
    mlp_hidden_dim: ${actor.model.mlp_hidden_dim}
    mlp_num_hidden_layers: ${actor.model.mlp_num_hidden_layers}
    actor_noise_sigma: ${actor.model.actor_noise_sigma}
    is_lora: False  # not use LoRA in MLP actor/Q
    lora_rank: 32

  rlt_feature_model:
    model_type: "openpi_rlinf"
    model_path: "${oc.env:PROJECT_ROOT,/app}/data/rlt_checkpoints/ur10e_rlt_stage1_sft_openpi_pi05/ur10e_plug_rlt_stage1_20260922_181649/global_step_18000/actor"
    precision: bf16
    num_action_chunks: 30
    action_dim: ${actor.model.action_dim}
    num_steps: 10   # denoise steps
    add_value_head: False
    is_lora: False
    lora_rank: 32
    openpi_data:
      repo_id: "plug_v2_merge_crop_vid"
      norm_stats_path: ${env.train.override_cfg.action_norm_stats_path}
    openpi:
      task: eval
      config_name: "pi05_ur10e_plug_lora_ki_rlt"
      num_images_in_input: 2
      action_chunk: 30
      action_horizon: 30
      action_env_dim: 10
      num_steps: 10
      model_action_dim: 32
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      max_token_len: 200
      discrete_state_input: True
      train_expert_only: False
      add_value_head: False
      detach_critic_input: True
      use_rlt: True
      rlt_alpha: 0.0
      # The rollout worker freezes the whole Stage 1 feature model after loading.
      # This SFT-only switch must be off for the eval wrapper used online.
      rlt_freeze_vla: False
      rlt_input_dim: 2048
      rlt_embed_dim: 2048
      rlt_prefix_seq_len: 1024
      rlt_num_layers: 2
      rlt_num_heads: 8
      rlt_mlp_ratio: 4.0  # hidden dim width ratio
      rlt_encoder_type: "append_self_attention"
      rlt_image_only: False
      rlt_use_mask: True

  enable_torch_compile: False
  enable_cuda_graph: False

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16
  global_batch_size: 64
  seed: 1234
  enable_offload: False

  model:
    model_type: "rlt_td3_mlp_policy"
    # RLT TD3 keeps the small Stage2 head in fp32 for Q-learning stability.
    precision: fp32
    policy_setup: "ur10e-tcp"
    action_dim: 10
    num_action_chunks: 15
    ref_num_action_chunks: 30
    z_dim: 2048
    proprio_dim: 10
    add_value_head: False
    add_q_head: True
    q_head_type: "default"
    mlp_hidden_dim: 256
    mlp_num_hidden_layers: 2
    actor_noise_sigma: 0.1
    is_lora: False
    lora_rank: 32

  optim:
    clip_grad: 10.0
    lr: 1.0e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 10.0
    lr: 1.0e-4
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    wrap_policy:
      module_classes_to_wrap:
        - TwinQCritic
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
