env_type: realworld
total_num_envs: 1
rollout_epoch: 1
auto_reset: false
ignore_terminations: false
reward_mode: raw
wrap_obs_mode: simple
seed: 0
group_size: 1
use_fixed_reset_state_ids: false
max_steps_per_rollout_epoch: 240
max_episode_steps: 240
main_image_key: base_0_rgb

video_cfg:
  save_video: false
  info_on_video: true
  video_base_dir: ${runner.logger.log_path}/video/eval

init_params:
  id: "UR10eEnv-v1"
  num_envs: null

override_cfg:
  # The endpoint normally comes from cluster.node_groups.hardware. Set this
  # only when running the environment without scheduler hardware injection.
  endpoint: null
  timeout_ms: 120000
  require_reset_confirmation: true
  reset_confirmation_text: "start"
  camera_max_age_ms: 500
  max_num_steps: ${env.eval.max_episode_steps}
