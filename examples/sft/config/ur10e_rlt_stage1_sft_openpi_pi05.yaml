defaults:
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0

runner:
  task_type: sft

  logger:
    log_path: "../results"
    project_name: rlinf-rlt
    experiment_name: "ur10e_plug_rlt_stage1_${now:%Y%m%d_%H%M%S}"
    logger_backends: ["tensorboard"]

  max_epochs: -1
  max_steps: 20000

  # RLinf official RLT Stage1 currently does not do validation.
  val_check_interval: -1
  save_interval: 2000


data:
  train_data_paths: "/app/data/lerobot_data/plug_v2_merge_crop_vid"
  num_workers: 12


actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  micro_batch_size: 1
  global_batch_size: 1
  seed: 42

  model:
    model_type: "openpi_rlinf"
    model_path: "/app/data/openpi-rlinf-checkpoints/pi05_ur10e_plug_lora_ki/plug_20260920_223703/20000"

    precision: fp32 # Stage1 建议先保持 fp32

    is_lora: false
    pi05: true

    num_action_chunks: 30
    action_dim: 10
    use_proprio: true
    num_steps: 10
    add_value_head: false

    openpi_data:
      repo_id: "plug_v2_merge_crop_vid"
      norm_stats_path: ${actor.model.model_path}/assets/plug_v2_merge_crop_vid/norm_stats.json

    openpi:
      task: sft

      config_name: "pi05_ur10e_plug_lora_ki_rlt"  # keep name same, but not train
      num_images_in_input: 2  # base + wrist

      # action_chunk: ${actor.model.num_action_chunks}
      # action_env_dim: ${actor.model.action_dim}
      # num_steps: ${actor.model.num_steps}

      model_action_dim: 32  # π0.5 内部 action padding

      # checkpoint 已经 merge LoRA，
      # 所以这里必须是普通 variant，而不是 *_lora
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"

      max_token_len: 200
      discrete_state_input: true

      # ---------------- RLT ----------------
      use_rlt: true

      # 你的实验：不再 SFT VLA
      rlt_alpha: 0.0

      rlt_input_dim: 2048
      rlt_embed_dim: 2048
      rlt_prefix_seq_len: 1024
      rlt_num_layers: 2
      rlt_num_heads: 8
      rlt_mlp_ratio: 4.0

      # 和官方 real-world RLT 保持一致
      rlt_image_only: false
      rlt_use_mask: true


  optim:
    lr: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0

    total_training_steps: ${runner.max_steps}
    lr_warmup_steps: 1000
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"

    use_orig_params: true   # freeze VLM, not train

    gradient_checkpointing: false

    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32


reward:
  use_reward_model: false

critic:
  use_critic_model: false